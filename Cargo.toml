[workspace]
members = ["cli", "programs/*"]

## members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[patch.crates-io]
# 使用 Git 仓库作为源，强制锁定版本
blake3 = { git = "https://github.com/BLAKE3-team/BLAKE3.git", tag = "1.5.5" }

# # 同理，如果 indexmap 也报错，也使用 Git 源（或者暂时注释掉看 blake3 是否通过）
indexmap = { git = "https://github.com/indexmap-rs/indexmap.git", tag = "2.5.0" }
